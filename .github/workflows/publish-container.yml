name: Publish PiDockCloud container

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 0.1.0-dev.1)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  # PRX3MUS's default publication contract uses the lowercase repository name.
  IMAGE: ghcr.io/knowledge-locker/pidockplatform

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate source
        run: |
          dotnet restore --locked-mode
          dotnet build --no-restore --configuration Release
          dotnet test --no-build --configuration Release
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Enter a version such as 0.1.0-dev.1." >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable cloud image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.version }}
          build-args: |
            WEB_URLS=http://+:8080
            WEB_CERTIFICATE_PATH=
            WEB_CERTIFICATE_KEY=
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          provenance: true
          sbom: true
      - name: Write PRX3MUS release metadata
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          jq -n \
            --arg version "$VERSION" --arg tag "$VERSION" \
            --arg publishId "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg publishedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg sourceCommit "$GITHUB_SHA" --arg image "$IMAGE" \
            --arg imageDigest "$DIGEST" --arg runId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{version:$version,tag:$tag,publishId:$publishId,publishedAt:$publishedAt,sourceCommit:$sourceCommit,image:$image,imageDigest:$imageDigest,workflow:{runId:$runId,runAttempt:$runAttempt}}' \
            > prox3mus-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: prox3mus-release-${{ inputs.version }}
          path: prox3mus-release.json
          if-no-files-found: error
          retention-days: 90

# Pi-native partition-level trial boot uses MBR partition numbers, not GPT indices.
image pidockos.img {
 hdimage { partition-table-type = "mbr" extended-partition = 4 disk-signature = 0x5049444b align = 1M }
 partition control { partition-type = 0x0c bootable = true image = "control.vfat" size = 192M offset = 1M }
 partition bootA { partition-type = 0x0c image = "system/boot-A.vfat" size = 192M }
 partition bootB { partition-type = 0x0c image = "system/boot-B.vfat" size = 192M }
 partition rootA { partition-type = 0x83 image = "system/rootfs.verity" size = 1664M }
 partition rootB { partition-type = 0x83 image = "system/rootfs.verity" size = 1664M }
 partition data { partition-type = 0x83 image = "data.ext4" size = 4096M }
}

# Authenticated sources only. No unauthenticated NTP or disabled TLS certificate checks.
server time.cloudflare.com iburst nts maxpoll 8
server nts.netnod.se iburst nts maxpoll 8
makestep 1.0 3
rtcsync
driftfile /var/lib/chrony/drift
ntsdumpdir /var/lib/chrony
# No remote chronyc control or NTP server listener.
cmdport 0
port 0
